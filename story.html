    <script>


        /* =========================================
           BOOK
        ========================================= */

        const bookElement =
            document.getElementById("book");

            const bookContainer = bookElement.parentElement;

        const pageFlip =
            new St.PageFlip(
                bookElement,
                {

                    width: 430,

                    height: 608,

                    size: "fixed",

                    minWidth: 280,

                    maxWidth: 550,

                    minHeight: 400,

                    maxHeight: 780,

                    showCover: true,

                    usePortrait: false,

                    drawShadow: true,

                    flippingTime: 900,

                    maxShadowOpacity: 0.35,

                    mobileScrollSupport: false,

                    useMouseEvents: true

                }
            );


        /* =========================================
           LOAD PAGES
        ========================================= */

        pageFlip.loadFromHTML(
    document.querySelectorAll(".page")
);

bookElement.style.setProperty(
    "transform",
    "translateX(-215px)",
    "important"
);

pageFlip.on("flip", function(e) {

    if (e.data === 0) {

        bookElement.style.setProperty(
            "transform",
            "translateX(-215px)",
            "important"
        );

    } else {

        bookElement.style.removeProperty("transform");

    }

});


        /* =========================================
           CONTROLS
        ========================================= */

        const previous =
            document.getElementById("previous");


        const next =
            document.getElementById("next");


        const status =
            document.getElementById("status");


        /* =========================================
           OPEN BOOK
        ========================================= */

        function openBook() {
    pageFlip.turnToPage(1);

    updateStatus(1);
}


        /* =========================================
           NEXT
        ========================================= */

        function nextPage() {

            pageFlip.flipNext("top");

        }


        /* =========================================
           PREVIOUS
        ========================================= */

        function previousPage() {

            const current =
                pageFlip.getCurrentPageIndex();


            /*
                If we're on the FIRST
                inside spread, close the book.
            */

            if (current <= 1) {

                pageFlip.turnToPage(0);

                updateStatus(0);

                return;

            }


            /*
                Otherwise do a normal
                animated page turn.
            */

            pageFlip.flipPrev("top");

        }


        /* =========================================
           STATUS
        ========================================= */

        function updateStatus(index) {


            /*
                CLOSED COVER
            */

            if (index === 0) {

bookElement.classList.add("cover-mode");

status.textContent = "Cover";

previous.disabled = true;
next.disabled = false;

return;
}


            /*
                FIRST INSIDE SPREAD
            */

            if (index === 1) {

bookElement.classList.remove("cover-mode");

status.textContent = "Pages 1–2";

previous.disabled = false;
next.disabled = false;

return;
}


            const total =
                pageFlip.getPageCount();


            /*
                FINAL PAGE
            */

            if (index >= total - 1) {

                status.textContent =
                    "Page 22";

                previous.disabled =
                    false;

                next.disabled =
                    true;

                return;

            }


            /*
                NORMAL SPREAD
            */

            status.textContent =
                `Pages ${index}–${index + 1}`;


            previous.disabled =
                false;


            next.disabled =
                false;

        }


        /* =========================================
           BUTTONS
        ========================================== */

        next.addEventListener(
            "click",
            nextPage
        );


        previous.addEventListener(
            "click",
            previousPage
        );


        /* =========================================
           PAGE FLIP EVENT
        ========================================== */

        pageFlip.on(
            "flip",
            function(event) {

                updateStatus(
                    event.data
                );

            }
        );


        /* =========================================
           KEYBOARD
        ========================================== */

        document.addEventListener(
            "keydown",
            function(event) {

                if (
                    event.key === "ArrowRight"
                ) {

                    nextPage();

                }


                if (
                    event.key === "ArrowLeft"
                ) {

                    previousPage();

                }

            }
        );


        /* =========================================
           INITIAL STATE
        ========================================== */

        updateStatus(0);

    </script>
